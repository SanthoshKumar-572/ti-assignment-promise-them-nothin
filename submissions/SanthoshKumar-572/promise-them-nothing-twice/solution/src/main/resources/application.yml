spring:
  application:
    name: rate-limiter
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:h2:mem:ratelimiterdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

customers:
  starter-company:
    limit: 60
  northwind:
    limit: 300
    schedules:
      - name: "nightly-batch"
        startTime: "07:00"
        endTime: "09:00"
        limit: 1500
  test-user:
    limit: 2


